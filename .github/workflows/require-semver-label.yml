name: Require semver label

# Bloqueia o merge de PRs contra a master que nao tenham nenhuma label de
# versionamento. Para isso funcionar de verdade (impedir o merge, nao so
# reportar), esse job precisa estar marcado como "required" nas branch
# protection rules da branch master no GitHub.

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]
    branches:
      - master

permissions:
  pull-requests: read

jobs:
  check-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const semverLabels = ['major', 'breaking', 'minor', 'feature', 'patch', 'fix'];
            const labels = context.payload.pull_request.labels.map((l) => l.name);
            const hasSemverLabel = labels.some((l) => semverLabels.includes(l));

            if (!hasSemverLabel) {
              core.setFailed(
                'Este PR precisa de uma label de versionamento antes de poder ser mergeado: ' +
                'major/breaking (versao major), minor/feature (versao minor), ou patch/fix (versao patch).'
              );
            }
